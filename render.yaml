# Render Blueprint: free web service.
# Note: the free plan has no persistent disk, so uploaded videos and the
# SQLite database reset whenever the service restarts or redeploys.
services:
  - type: web
    name: memories-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
